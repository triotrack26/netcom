<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0">
    <title>Laptop Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="landing">

    <div class="landing-card">
        <div class="logo">LA</div>

        <h1>Laptop Analyzer</h1>

        <p>
            Professional laptop hardware diagnostic and testing system
        </p>

        <div class="status">
            <span class="status-dot"></span>
            Ready for machine diagnostics
        </div>

        <button class="primary-btn" onclick="startAnalyzer()">
            Start Machine Check
        </button>

        <div class="small-text">
            System • Battery • Camera • Mic • Sound • Display • Speed • Ports
        </div>
    </div>

    <script>
        function startAnalyzer() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
